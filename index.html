<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELECTROBOL - Chatbot</title>
    <style>
        :root {
            --bg-primary: #0f0f14;
            --bg-secondary: #1a1a24;
            --bg-tertiary: #22222e;
            --bg-sidebar: #14141e;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --accent: #8b5cf6;
            --accent-light: #a78bfa;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --accent-soft: rgba(139, 92, 246, 0.08);
            --border: #2a2a38;
            --bubble-user: #2a2a3c;
            --bubble-ai: #1e1e2c;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 8px;
            --radius-full: 9999px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: #0a0a10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at 25% 25%, rgba(139, 92, 246, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 70%, rgba(59, 130, 246, 0.03) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(236, 72, 153, 0.02) 0%, transparent 60%);
            animation: bgDrift 30s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes bgDrift {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(1%, -0.5%) rotate(0.5deg);
            }
            50% {
                transform: translate(-0.5%, 1%) rotate(-0.3deg);
            }
            75% {
                transform: translate(-1%, -0.5%) rotate(0.4deg);
            }
        }

        .app-container {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 92vh;
            max-height: 850px;
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--border);
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            transition: var(--transition);
            z-index: 2;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 18px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }
        .logo-area:hover {
            background: rgba(255, 255, 255, 0.015);
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 40%, #4c1d95 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 15px var(--accent-glow), 0 0 0 3px rgba(139, 92, 246, 0.12);
            flex-shrink: 0;
            overflow: hidden;
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            top: -30%;
            left: -30%;
            width: 60%;
            height: 100%;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            transform: rotate(25deg);
            filter: blur(6px);
        }
        .logo-icon svg {
            width: 22px;
            height: 22px;
            position: relative;
            z-index: 1;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .logo-text .brand {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            line-height: 1;
        }
        .logo-text .tagline {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .new-chat-btn {
            margin: 14px 14px 10px;
            padding: 11px 16px;
            background: var(--accent-soft);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: var(--radius-md);
            color: var(--accent-light);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 9px;
            transition: var(--transition);
            font-family: var(--font-sans);
            letter-spacing: -0.2px;
        }
        .new-chat-btn:hover {
            background: rgba(139, 92, 246, 0.16);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.1);
            transform: translateY(-1px);
        }
        .new-chat-btn:active {
            transform: scale(0.97);
            transition: 0.08s;
        }
        .new-chat-btn svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent-light);
            fill: none;
            stroke-width: 2.5;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 4px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .chat-history::-webkit-scrollbar {
            width: 4px;
        }
        .chat-history::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
            position: relative;
        }
        .history-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }
        .history-item.active {
            background: rgba(139, 92, 246, 0.1);
            color: #c4b5fd;
            font-weight: 600;
        }
        .history-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: var(--accent);
            border-radius: 0 4px 4px 0;
        }
        .history-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
            opacity: 0.6;
        }
        .history-item.active .history-dot {
            background: var(--accent-light);
            opacity: 1;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .sidebar-footer {
            padding: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .sidebar-footer .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f472b6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .sidebar-footer span {
            flex: 1;
            font-weight: 500;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            min-width: 0;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-primary);
            z-index: 2;
        }
        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-tertiary);
            padding: 7px 14px;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            border: 1px solid transparent;
            transition: var(--transition);
            letter-spacing: -0.2px;
        }
        .model-selector:hover {
            border-color: var(--border);
            background: var(--bg-secondary);
        }
        .model-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                box-shadow: 0 0 6px rgba(52, 211, 153, 0.4);
            }
            50% {
                box-shadow: 0 0 16px rgba(52, 211, 153, 0.8);
            }
        }
        .top-actions {
            display: flex;
            gap: 6px;
        }
        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .icon-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }
        .messages-container::-webkit-scrollbar {
            width: 5px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 82%;
            animation: msgIn 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.ai {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 2px;
        }
        .message.user .msg-avatar {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
        }
        .message.ai .msg-avatar {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
            box-shadow: 0 0 14px rgba(139, 92, 246, 0.3);
        }

        .msg-bubble {
            padding: 13px 17px;
            border-radius: var(--radius-lg);
            font-size: 0.9rem;
            line-height: 1.6;
            letter-spacing: -0.2px;
            position: relative;
            word-break: break-word;
        }
        .message.user .msg-bubble {
            background: var(--bubble-user);
            color: var(--text-primary);
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .message.ai .msg-bubble {
            background: var(--bubble-ai);
            color: #d4d4e8;
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .msg-bubble code {
            background: rgba(0, 0, 0, 0.35);
            padding: 2px 7px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: #f0abfc;
        }
        .msg-bubble pre {
            background: #0d0d16;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 8px 0;
            border: 1px solid var(--border);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            line-height: 1.5;
        }
        .msg-bubble pre code {
            background: none;
            padding: 0;
            color: #e2e8f0;
        }

        .input-area {
            padding: 14px 20px 18px;
            border-top: 1px solid var(--border);
            background: var(--bg-primary);
        }
        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-lg);
            padding: 6px 8px 6px 16px;
            border: 1.5px solid transparent;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }
        .input-wrapper:focus-within {
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 0 5px rgba(139, 92, 246, 0.06), var(--shadow-md);
            background: var(--bg-secondary);
        }
        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            resize: none;
            padding: 8px 0;
            max-height: 140px;
            min-height: 26px;
            line-height: 1.5;
            letter-spacing: -0.2px;
        }
        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }
        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .send-btn:hover {
            background: #7c3aed;
            box-shadow: 0 6px 22px rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
        }
        .send-btn:active {
            transform: scale(0.92);
            transition: 0.08s;
        }
        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.5;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 7px;
            height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typingBounce 1.3s ease-in-out infinite;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.15s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.3s;
        }
        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.35;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                min-width: 0;
                overflow: hidden;
                border-right: none;
                padding: 0;
            }
            .sidebar.open {
                width: 260px;
                min-width: 260px;
                border-right: 1px solid var(--border);
            }
            .app-container {
                border-radius: 0;
                height: 100vh;
                max-height: 100vh;
            }
            .message {
                max-width: 92%;
            }
            .msg-bubble {
                font-size: 0.85rem;
                padding: 11px 14px;
            }
        }

        .glow-text {
            background: linear-gradient(135deg, #c4b5fd, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="logo-area" title="ELECTROBOL - Inicio">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3" fill="#fff" stroke="none" opacity="0.9"/>
                        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"
                        stroke="#fff" stroke-width="1.8" opacity="0.7"/>
                        <circle cx="12" cy="12" r="8" stroke="#fff" stroke-width="1" opacity="0.35" fill="none"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="brand glow-text">ELECTROBOL</span>
                    <span class="tagline">Asistente de Pagos</span>
                </div>
            </div>

            <button class="new-chat-btn" onclick="newChat()">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                Nuevo Chat
            </button>

            <nav class="chat-history" id="chatHistory"></nav>

            <div class="sidebar-footer">
                <div class="user-avatar">C</div>
                <span>Sesión activa</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            </div>
        </aside>

        <main class="main-area">
            <div class="top-bar">
                <div class="model-selector" title="Modelo activo">
                    <span class="model-dot"></span>
                    Agente IA v2
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="opacity:0.6"><path d="M6 9l6 6 6-6"/></svg>
                </div>
                <div class="top-actions">
                    <button class="icon-btn" title="Buscar en conversación">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    </button>
                    <button class="icon-btn" title="Configuración">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    </button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea
                        id="userInput"
                        rows="1"
                        placeholder="Escribe tu mensaje aquí... (Shift+Enter para nueva línea)"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <button class="send-btn" onclick="sendMessage()" title="Enviar mensaje">
                        <svg viewBox="0 0 24 24">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
                <div style="text-align:center; margin-top:8px; font-size:0.7rem; color:var(--text-muted); opacity:0.7;">
                    ELECTROBOL · Respuestas rápidas y precisas · v2.4
                </div>
            </div>
        </main>
    </div>

<script>
    const API_URL = 'https://chain-empirical-egomaniac.ngrok-free.dev/webhook/electrobol-chat';
    const SESSION_STORAGE_KEY = 'electrobol_session_id';
    const HISTORY_STORAGE_KEY = 'electrobol_chat_history';
    const HISTORY_LIMIT = 10;

    const messagesContainer = document.getElementById('messagesContainer');
    const userInput = document.getElementById('userInput');
    const chatHistory = document.getElementById('chatHistory');
    const sendBtn = document.querySelector('.send-btn');

    let currentSessionId = getOrCreateSessionId();
    let historyEntries = loadHistory();
    let activeHistoryId = null;
    let isSending = false;
    let isHistoryLocked = false;
    let hasCurrentSessionHistory = historyEntries.some((item) => item.sessionId === currentSessionId);

    renderHistory();
    renderStartScreen();

    userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
    });

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage(presetText = '') {
        if (isSending) return;

        const text = (presetText || userInput.value).trim();
        if (!text) return;

        if (isHistoryLocked) {
            showArchivedSessionMessage();
            return;
        }

        hideStartScreen();
        addMessage('user', text, { allowLineBreaks: true });
        userInput.value = '';
        userInput.style.height = 'auto';
        scrollToBottom();

        if (!hasCurrentSessionHistory) {
            addHistoryEntryForCurrentSession(text);
        }

        const typingMsg = addTypingIndicator();
        setSendingState(true);
        scrollToBottom();

        try {
            const botResponse = await fetchBotResponse(text);
            addMessage('ai', botResponse, { allowLineBreaks: true });
        } catch (error) {
            console.error('Error al consultar la API:', error);
            addMessage('ai', '⚠️ No se pudo conectar con el servidor. Intenta de nuevo.', { warning: true });
        } finally {
            removeTypingIndicator(typingMsg);
            setSendingState(false);
            scrollToBottom();
        }
    }

    async function fetchBotResponse(message) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000);

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    sessionId: currentSessionId,
                    message,
                }),
                signal: controller.signal,
            });

            if (!response.ok) {
                throw new Error(`Error HTTP ${response.status}`);
            }

            const data = await response.json();
            const nested = data && typeof data.response === 'object' ? data.response : null;
            let botText =
                nested?.output ||
                nested?.message ||
                nested?.text ||
                data.output ||
                data.message ||
                data.text ||
                data.response ||
                'Sin respuesta del servidor';

            if (typeof botText !== 'string') {
                botText = JSON.stringify(botText);
            }

            return botText;
        } finally {
            clearTimeout(timeoutId);
        }
    }

    function addMessage(role, content, options = {}) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        const avatarLetter = role === 'user' ? 'C' : 'E';

        let safeContent = escapeHTML(String(content));
        if (options.allowLineBreaks) {
            safeContent = safeContent.replace(/\n/g, '<br>');
        }

        msgDiv.innerHTML = `
            <div class="msg-avatar">${avatarLetter}</div>
            <div class="msg-bubble">${safeContent}</div>
        `;

        if (options.warning) {
            const bubble = msgDiv.querySelector('.msg-bubble');
            bubble.style.borderColor = 'rgba(251, 191, 36, 0.45)';
            bubble.style.background = 'rgba(251, 191, 36, 0.08)';
            bubble.style.color = '#fde68a';
        }

        messagesContainer.appendChild(msgDiv);
        return msgDiv;
    }

    function addTypingIndicator() {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ai';
        msgDiv.id = 'typing-indicator-msg';
        msgDiv.innerHTML = `
            <div class="msg-avatar">E</div>
            <div class="msg-bubble">
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>
        `;
        messagesContainer.appendChild(msgDiv);
        return msgDiv;
    }

    function removeTypingIndicator(el) {
        if (el && el.parentNode) {
            el.remove();
        }
    }

    function scrollToBottom() {
        requestAnimationFrame(() => {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    }

    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function setSendingState(disabled) {
        isSending = disabled;
        sendBtn.disabled = disabled;
        sendBtn.classList.toggle('disabled', disabled);
        sendBtn.style.pointerEvents = disabled ? 'none' : '';
    }

    function getOrCreateSessionId() {
        const existing = localStorage.getItem(SESSION_STORAGE_KEY);
        if (existing) return existing;
        const next = crypto.randomUUID();
        localStorage.setItem(SESSION_STORAGE_KEY, next);
        return next;
    }

    function createNewSessionId() {
        const next = crypto.randomUUID();
        localStorage.setItem(SESSION_STORAGE_KEY, next);
        return next;
    }

    function loadHistory() {
        const raw = localStorage.getItem(HISTORY_STORAGE_KEY);
        if (!raw) return [];

        try {
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) {
                console.error('Formato de historial inválido en localStorage.');
                return [];
            }

            return parsed
                .filter(
                    (item) =>
                        item &&
                        typeof item.id === 'string' &&
                        typeof item.title === 'string' &&
                        typeof item.sessionId === 'string'
                )
                .slice(-HISTORY_LIMIT);
        } catch (error) {
            console.error('No se pudo parsear el historial almacenado:', error);
            return [];
        }
    }

    function saveHistory() {
        try {
            localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(historyEntries));
        } catch (error) {
            console.error('No se pudo guardar el historial:', error);
        }
    }

    function renderHistory() {
        chatHistory.innerHTML = '';

        historyEntries.forEach((entry) => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.dataset.id = entry.id;
            item.dataset.sessionId = entry.sessionId;
            if (entry.id === activeHistoryId) {
                item.classList.add('active');
            }

            item.innerHTML = `<span class="history-dot"></span> ${escapeHTML(entry.title)}`;
            chatHistory.appendChild(item);
        });
    }

    function addHistoryEntryForCurrentSession(firstMessage) {
        const title = firstMessage.slice(0, 35);
        const newEntry = {
            id: crypto.randomUUID(),
            title,
            sessionId: currentSessionId,
        };

        historyEntries.push(newEntry);
        while (historyEntries.length > HISTORY_LIMIT) {
            historyEntries.shift();
        }

        hasCurrentSessionHistory = true;
        isHistoryLocked = false;
        activeHistoryId = newEntry.id;
        saveHistory();
        renderHistory();
    }

    function showArchivedSessionMessage() {
        messagesContainer.innerHTML = '';
        addMessage(
            'ai',
            '📂 Sesión anterior cargada. Esta conversación ya finalizó. Inicia un nuevo chat para continuar.',
            { allowLineBreaks: true }
        );
        scrollToBottom();
    }

    function renderStartScreen() {
        messagesContainer.innerHTML = '';
        const start = document.createElement('div');
        start.id = 'start-screen';
        start.style.width = '100%';
        start.style.display = 'flex';
        start.style.justifyContent = 'center';
        start.style.paddingTop = '8vh';

        start.innerHTML = `
            <div style="text-align:center; width:100%; max-width:760px;">
                <h1 style="font-size:2.3rem; color:var(--text-primary); letter-spacing:-0.6px; margin-bottom:12px;">¿Qué toca hoy?</h1>
                <p style="font-size:0.95rem; color:var(--text-secondary); margin-bottom:22px;">Consulta tus deudas, registra pagos y más</p>
                <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                    <button type="button" data-suggestion="Ver mis deudas pendientes" style="background:var(--bg-tertiary); color:var(--text-primary); border:1px solid var(--border); border-radius:999px; padding:10px 14px; cursor:pointer; font-size:0.85rem; font-family:var(--font-sans);">Ver mis deudas pendientes</button>
                    <button type="button" data-suggestion="Registrar un pago" style="background:var(--bg-tertiary); color:var(--text-primary); border:1px solid var(--border); border-radius:999px; padding:10px 14px; cursor:pointer; font-size:0.85rem; font-family:var(--font-sans);">Registrar un pago</button>
                    <button type="button" data-suggestion="Ver historial de pagos" style="background:var(--bg-tertiary); color:var(--text-primary); border:1px solid var(--border); border-radius:999px; padding:10px 14px; cursor:pointer; font-size:0.85rem; font-family:var(--font-sans);">Ver historial de pagos</button>
                </div>
            </div>
        `;

        start.querySelectorAll('[data-suggestion]').forEach((button) => {
            button.addEventListener('click', () => {
                sendMessage(button.dataset.suggestion || '');
            });
        });

        messagesContainer.appendChild(start);
        scrollToBottom();
    }

    function hideStartScreen() {
        const start = document.getElementById('start-screen');
        if (start) {
            start.remove();
        }
    }

    function newChat() {
        currentSessionId = createNewSessionId();
        hasCurrentSessionHistory = false;
        isHistoryLocked = false;
        activeHistoryId = null;
        renderHistory();
        renderStartScreen();
        userInput.value = '';
        userInput.style.height = 'auto';
        userInput.focus();
    }

    chatHistory.addEventListener('click', (e) => {
        const item = e.target.closest('.history-item');
        if (!item) return;

        activeHistoryId = item.dataset.id || null;
        isHistoryLocked = true;
        renderHistory();
        showArchivedSessionMessage();
        userInput.focus();
    });

    userInput.focus();
    scrollToBottom();

    console.log('ELECTROBOL Chatbot listo.');
</script>
</body>
</html>
